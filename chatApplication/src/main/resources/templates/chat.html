<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Real-Time Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@5.0.0/bundles/stomp.umd.js"></script>
</head>
<body>
<div class="container mt-4">
    <h1 class="text-center">Chat-App</h1>
    <div id="chat"
         class="border rounded p-3 mb-3"
         style="height: 300px; overflow-y: auto;">
    </div>

    <div class="input-group mb-3">
        <input id="senderInput" type="text" class="form-control"
               placeholder="Your name: "/>
    </div>
    <div class="input-group mb-3">
        <input id="messageInput" type="text" class="form-control"
               placeholder="Type a message......"/>
        <div class="input-group-append">
            <button id="send-message-btn" class="btn btn-primary">Send</button>
        </div>
    </div>
</div>
</body>
<script>
    let stompClient = null;

    function setConnected(connected) {
        const sendButton = document.getElementById('send-message-btn');
        if (sendButton) {
            sendButton.disabled = !connected;
        }
    }

    function connect() {
      const socket = new SockJS('/chat');
      stompClient = Stomp.over(socket);
      stompClient.connect({}, function(frame) {
         setConnected(true);
         console.log('Connected: ' + frame);
         stompClient.subscribe('/topic/messages', function(message) {
            showMessage(JSON.parse(message.body));
         });
      }, function(error) {
          console.error('STOMP connection error:', error);
          setConnected(false);
      });
    }

    function showMessage(message) {
        const chat = document.getElementById('chat');
        const messageElement = document.createElement('div');
        messageElement.textContent = message.sender + ' : ' + message.content;
        messageElement.className = "border-bottom mb-1"; // Correct attribute
        chat.appendChild(messageElement);
        chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
        if (!stompClient || !stompClient.connected) {
            console.error("STOMP client is not connected.");
            return;
        }

        const sender = document.getElementById('senderInput').value;
        const content = document.getElementById('messageInput').value;

        if (!sender.trim() || !content.trim()) {
            console.log("Sender and message content cannot be empty.");
            return;
        }

        const chatMessage = {
           sender: sender,
           content: content
        };

        stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage));
        document.getElementById('messageInput').value = '';
    }

    document.addEventListener('DOMContentLoaded', function() {
        const sendButton = document.getElementById('send-message-btn');
        if (sendButton) {
            sendButton.addEventListener('click', sendMessage);
        }
        connect();
    });
</script>
</html>
